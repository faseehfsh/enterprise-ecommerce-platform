spring.application.name=ecommerce-backend

# Import local environment configuration
spring.config.import=optional:file:./.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate Configuration
# Hibernate validates whether your entity classes match the database structure.
# Hibernate does not automatically modify your database schema.
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
# Flyway manages database schema changes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration